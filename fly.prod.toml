# Loopany PRODUCTION on Fly.io — app "loopany-prod", domain loopany.ai.
#
# ONE always-on machine (the scheduler owns the cron loop; never scale to >1 or
# you'd double-fire). STATELESS container: all state lives in Supabase Postgres
# (DATABASE_URL / DIRECT_DATABASE_URL secrets) and Cloudflare R2 (artifact bytes).
# No mounted volume — nothing on local disk to persist.
#
# `loopany-testing` (fly.toml) stays as staging; this is a SEPARATE app so a
# staging push can never touch prod.
#
# One-time setup:
#   fly launch --no-deploy --name loopany-prod --copy-config -c fly.prod.toml
#   fly secrets set -a loopany-prod \
#       DATABASE_URL='postgresql://...pooler.supabase.com:6543/postgres?sslmode=require' \
#       DIRECT_DATABASE_URL='postgresql://...supabase.com:5432/postgres?sslmode=require' \
#       LOOPANY_AUTH_SECRET="$(openssl rand -hex 32)" \
#       GITHUB_CLIENT_ID=... GITHUB_CLIENT_SECRET=... \
#       LOOPANY_BASE_URL=https://loopany.ai \
#       LOOPANY_ALLOWED_LOGINS=you@example.com \
#       LOOPANY_R2_ACCOUNT_ID=... LOOPANY_R2_BUCKET=... \
#       LOOPANY_R2_ACCESS_KEY_ID=... LOOPANY_R2_SECRET_ACCESS_KEY=...
#   fly certs add loopany.ai -a loopany-prod   # then add the DNS records Fly prints
#   fly deploy --ha=false -c fly.prod.toml     # --ha=false = exactly ONE machine
#                                              # (Fly's default HA spawns a 2nd -> double scheduler).
#                                              # boot runs the migration over DIRECT_DATABASE_URL.

app = "loopany-prod"
# Colocated with the Supabase project (us-west-1) to minimize DB latency.
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  # No LOOPANY_DATA_DIR / volume: the container is stateless (Supabase + R2).

[http_service]
  internal_port = 3000
  force_https = true
  # Scheduler must stay awake → no scale-to-zero, exactly one machine.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # DB-touching health check → SURFACES a wedged pool (a 503/timeout from
  # /api/health/db marks the machine unhealthy and Fly de-routes it). NB: a failing
  # check does NOT restart the VM — only `restart.policy = "on-failure"` (a process
  # EXIT) does. Auto-recovery from a wedged pool is the in-process DB watchdog
  # (server/dbWatchdog.ts), which exits so this restart policy brings up a fresh
  # pool. grace_period covers boot + in-process migrations. Rationale:
  # packages/server/src/routes/api.health.db.ts.
  [[http_service.checks]]
    method = "get"
    path = "/api/health/db"
    interval = "15s"
    timeout = "10s"
    grace_period = "30s"

# DEDICATED cpu, deliberately NOT a shared-cpu size - do not move it back.
#
# The 2026-08-10 outage: on `shared-cpu-1x` prod exhausted its CPU burst balance
# and was pinned at the ~6% baseline (measured: 88% `steal` in /proc/stat, PSI
# `some avg10=51`, load 1.38 on 1 vCPU). Node's event loop starved, so it could
# not drain the DB sockets - every Postgres backend sat in `ClientRead` with zero
# lock contention while a plain `select 1` took 0.6-5s. The DB watchdog
# (server/dbWatchdog.ts) read that as a wedged pool and exited the process, and
# every restart re-armed 109 enabled loops + misfire catch-up, spiking CPU again
# on an already-drained balance. Each life got shorter (455s -> 161s -> 100s), so
# the balance never recovered: a death spiral, ~2h of hard downtime.
#
# The watchdog cannot tell "pool wedged" from "event loop starved" (a known gap,
# tracked separately). A dedicated core removes the trigger: steal drops to ~0,
# so CPU starvation can never masquerade as a wedged pool again. Shared CPU is
# also simply the wrong shape here - the scheduler must stay responsive 24/7.
[[vm]]
  size = "performance-1x"
  memory = "2048mb"
