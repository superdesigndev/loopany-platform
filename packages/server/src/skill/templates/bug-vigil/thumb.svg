<svg viewBox="0 0 144 80" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <!-- Mock of a closed loop staking out one bug: a goal chip, a patrol
       timeline that stays flat then spikes on a recurrence, the captured
       context report, and the finish. Colors ride the app's CSS variables. -->
  <rect x="10" y="8" width="60" height="11" rx="5.5" fill="var(--color-success-soft, rgba(0,155,72,0.1))"/>
  <circle cx="18" cy="13.5" r="2" fill="var(--color-rubik-green, #009b48)"/>
  <rect x="24" y="12.25" width="38" height="2.5" rx="1.25" fill="var(--color-rubik-green, #009b48)" opacity="0.55"/>
  <rect x="10.5" y="26.5" width="40" height="45" rx="5" fill="var(--color-surface, #fff)" stroke="var(--color-hairline, #e3e5ea)"/>
  <path d="M15 60h50" stroke="var(--color-hairline, #e3e5ea)" stroke-width="1.2"/>
  <path d="M16 56 22 57 28 55.5 34 56.5 40 44 44 56 46 55.5" stroke="var(--color-rubik-red, #b71234)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="40" cy="44" r="2.6" fill="var(--color-rubik-red, #b71234)"/>
  <rect x="16" y="33" width="20" height="2.5" rx="1.25" fill="var(--color-wire, #cfd3db)"/>
  <rect x="55.5" y="30.5" width="32" height="30" rx="4" fill="var(--color-surface, #fff)" stroke="var(--color-hairline, #e3e5ea)"/>
  <rect x="59.5" y="35" width="14" height="2.5" rx="1.25" fill="var(--color-rubik-red, #b71234)" opacity="0.7"/>
  <g fill="var(--color-hairline, #e3e5ea)">
    <rect x="59.5" y="41" width="24" height="2.2" rx="1.1"/>
    <rect x="59.5" y="46" width="20" height="2.2" rx="1.1"/>
    <rect x="59.5" y="51" width="24" height="2.2" rx="1.1"/>
    <rect x="59.5" y="56" width="14" height="2.2" rx="1.1"/>
  </g>
  <path d="M91 45h13" stroke="var(--color-wire, #cfd3db)" stroke-width="1.2" stroke-dasharray="3 3"/>
  <circle cx="119" cy="45" r="11" fill="var(--color-success-soft, rgba(0,155,72,0.1))"/>
  <path d="M113.5 45l3.5 3.5 7-8" stroke="var(--color-rubik-green, #009b48)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
