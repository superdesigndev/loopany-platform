  <circle cx="24" cy="21" r="6" fill="var(--color-rubik-yellow, #ffd500)"/>
  <g stroke="var(--color-rubik-yellow, #ffd500)" stroke-width="1.4" stroke-linecap="round">
    <path d="M24 11v-3M24 34v-3M11 21h-3M40 21h-3M15 12l-2-2M35 12l2-2M15 30l-2 2M35 30l2 2"/>
  </g>
  <rect x="34" y="15" width="20" height="3" rx="1.5" fill="var(--color-wire, #cfd3db)"/>
  <rect x="34" y="22" width="14" height="2.5" rx="1.25" fill="var(--color-hairline, #e3e5ea)"/>
  <path d="M17 42h60" stroke="var(--color-hairline, #e3e5ea)" stroke-width="1.2"/>
