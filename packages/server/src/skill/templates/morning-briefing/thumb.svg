  <rect x="93.5" y="12.5" width="40" height="11" rx="5" fill="var(--color-interactive-soft, rgba(0,70,173,0.08))"/>
  <g stroke="var(--color-hairline, #e3e5ea)" fill="var(--color-surface, #fff)">
